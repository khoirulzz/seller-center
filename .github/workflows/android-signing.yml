name: Sign Android release
on:
  push:
    branches: [work/release-signing]
    paths: [.github/workflows/android-signing.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android CI push run containing reviewed release APKs
        required: true
        default: '39059166263'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN: ${{ inputs.run_id || '39059166263' }}
      GH_READ_TOKEN: ${{ github.token }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release signing scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,textwrap
          source=Path('.github/workflows/android-signing.yml').read_text()
          for index,block in enumerate(re.findall(r"python3 - <<'PY'\n(.*?)\n          PY",source,re.S)):
              compile(textwrap.dedent(block),'signing-step-'+str(index),'exec')
          compile(Path('tool/import_release_signing.py').read_text(),'import_release_signing.py','exec')
          print('Signing script syntax verified.')
          PY
      - name: Verify successful reviewed source and signing configuration
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          required=['ANDROID_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD']
          missing=[key for key in required if not os.environ.get(key)]
          for key in required:
              print(key+' configured: '+str(key not in missing))
          if missing: raise SystemExit('Missing permanent signing secrets: '+', '.join(missing))
          run_id=os.environ['SOURCE_RUN']
          if not run_id.isdigit(): raise SystemExit('Invalid source run')
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+run_id
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response: run=json.load(response)
          first=run['id']==39059166263 and run['head_sha']=='96413c6132fab11023957f488f429a914149c135'
          if run['conclusion']!='success' or run['path']!='.github/workflows/android-build.yml':
              raise SystemExit('Source must be a successful Android CI release build')
          if not first and (run['head_branch']!='main' or run['event']!='push'):
              raise SystemExit('Only reviewed main push builds can be signed')
          with open(os.environ['RUNNER_TEMP']+'/source-release.json','w')as file:
              json.dump({'source_run':run['id'],'source_commit':run['head_sha']},file)
          print('Reviewed source verified: '+run['head_sha'])
          PY
      - uses: actions/download-artifact@v4
        with:
          name: nalaro-seller-center-unsigned-release-apks
          run-id: ${{ inputs.run_id || '39059166263' }}
          github-token: ${{ github.token }}
          path: unsigned
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Sign and verify every release APK
        run: |
          python3 - <<'PY'
          import os,base64,json,subprocess,re,hashlib
          from pathlib import Path
          tools=sorted((Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/apksigner'),key=lambda p:tuple(int(n)for n in re.findall(r'\d+',p.parent.name)))[-1].parent
          key=Path(os.environ['RUNNER_TEMP'])/'nalaro-release.jks'
          fd=os.open(key,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'wb')as file:file.write(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'],validate=True))
          output=Path('signed');output.mkdir()
          metadata=json.loads((Path(os.environ['RUNNER_TEMP'])/'source-release.json').read_text())
          metadata['apks']=[]
          for apk in sorted(Path('unsigned').glob('*.apk')):
              aligned=Path(os.environ['RUNNER_TEMP'])/apk.name
              subprocess.run([str(tools/'zipalign'),'-P','16','-f','4',str(apk),str(aligned)],check=True)
              badging=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
              version=re.search(r"versionName='([^']+)'",badging).group(1)
              build=re.search(r"versionCode='([0-9]+)'",badging).group(1)
              target=output/apk.name.replace('app-','Nalaro-Seller-Center-'+version+'-')
              subprocess.run([str(tools/'apksigner'),'sign','--ks',str(key),'--ks-key-alias',os.environ['ANDROID_KEY_ALIAS'],'--ks-pass','env:ANDROID_KEYSTORE_PASSWORD','--key-pass','env:ANDROID_KEY_PASSWORD','--out',str(target),str(aligned)],check=True)
              verified=subprocess.run([str(tools/'apksigner'),'verify','--verbose','--print-certs',str(target)],capture_output=True,text=True,check=True)
              digest=next(line.split(': ',1)[1]for line in verified.stdout.splitlines()if line.startswith('Signer #1 certificate SHA-256 digest:'))
              metadata['apks'].append({'file':target.name,'version':version,'version_code':int(build),'bytes':target.stat().st_size,'sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'certificate_sha256':digest})
              print('Verified permanent signature: '+target.name)
          if len(metadata['apks'])!=3:raise SystemExit('Expected all three architecture APKs')
          (output/'RELEASE.json').write_text(json.dumps(metadata,indent=2))
          (output/'README.txt').write_text('NALARO SELLER CENTER RELEASE\nPilih ARM64 untuk sebagian besar HP Android modern. ARMv7 untuk perangkat 32-bit; x86_64 untuk emulator.\nAPK ditandatangani menggunakan kunci permanen pada repository secrets.\nAPK debug lama dapat memakai sertifikat berbeda; simpan draft lokal sebelum mengganti instalasi.\nPembaruan otomatis Shorebird belum aktif sampai app_id terdaftar dan baseline Shorebird dipasang.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nalaro-seller-center-signed-release-apks
          path: signed/
          if-no-files-found: error
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nalaro-release.jks"

  source_bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: seller-center
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: khoirulzz/nalarostore
          ref: main
          path: nalarostore
          persist-credentials: false
      - name: Package complete committed Android and web sources
        run: |
          mkdir bundle
          git -C seller-center archive --format=tar --prefix=seller-center/ HEAD | tar -xf - -C bundle
          git -C nalarostore archive --format=tar --prefix=nalarostore/ HEAD | tar -xf - -C bundle
          python3 - <<'PY'
          import subprocess,json
          from pathlib import Path
          manifest={name:subprocess.check_output(['git','-C',name,'rev-parse','HEAD'],text=True).strip() for name in ['seller-center','nalarostore']}
          Path('bundle/SOURCE_MANIFEST.json').write_text(json.dumps(manifest,indent=2))
          Path('bundle/README.txt').write_text('NALARO ANDROID + WEB SOURCE\nComplete committed sources; see SOURCE_MANIFEST.json. No private signing keys are included.\nRead seller-center/docs/OTA.md for Shorebird activation. Use tool/import_release_signing.py with the private backup to configure the four Android signing secrets, then run Sign Android release.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Nalaro-Android-Web-Source-1.2.0
          path: bundle/
          if-no-files-found: error
