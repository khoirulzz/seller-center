name: Android CI
on:
  push:
    branches: [main, work/professional-seller-center]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test OTA build configuration
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Generate native Android project
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/nalaro-AndroidManifest.xml
          cp pubspec.lock "$RUNNER_TEMP/seller-pubspec.lock"
          flutter create --no-pub --platforms=android --org digital.nalaro --project-name nalaro_seller_center .
          cp /tmp/nalaro-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          # Flutter create rewrites the lockfile even with --no-pub.
          cp "$RUNNER_TEMP/seller-pubspec.lock" pubspec.lock
      - name: Remove generated Flutter demo test
        run: rm -f test/widget_test.dart
      - run: flutter pub get --enforce-lockfile
      - name: Generate launcher icon from official Nalaro Store asset
        run: |
          dart run flutter_launcher_icons
          python3 tool/configure_launcher.py
      - name: Format Dart sources
        run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Upload UI layout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-ui-qa
          path: build/ui-qa/
          if-no-files-found: ignore
      - name: Capture formatting changes
        if: always()
        run: git diff -- lib test > build/formatted-source.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seller-formatting
          path: build/formatted-source.patch
      - name: Prepare unsigned release for offline permanent signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android/app/build.gradle.kts')
          text=path.read_text()
          marker='signingConfig = signingConfigs.getByName("debug")'
          if text.count(marker)!=1: raise SystemExit('Expected generated signing configuration')
          path.write_text(text.replace(marker,'signingConfig = null'))
          PY
      - run: flutter build apk --release --split-per-abi
      - name: Upload unsigned release APKs
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-seller-center-unsigned-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
