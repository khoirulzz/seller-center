name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test OTA build configuration
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Generate native Android project
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/nalaro-AndroidManifest.xml
          flutter create --no-pub --platforms=android --org digital.nalaro --project-name nalaro_seller_center .
          cp /tmp/nalaro-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Remove generated Flutter demo test
        run: rm -f test/widget_test.dart
      - run: flutter pub get --enforce-lockfile
      - name: Generate launcher icon from official Nalaro Store asset
        run: dart run flutter_launcher_icons
      - name: Format Dart sources
        run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Upload UI layout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-ui-qa
          path: build/ui-qa/
          if-no-files-found: ignore
      - run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-seller-center-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
