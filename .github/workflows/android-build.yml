name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Android project
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/nalaro-AndroidManifest.xml
          flutter create --platforms=android --org digital.nalaro --project-name nalaro_seller_center .
          cp /tmp/nalaro-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Remove generated Flutter demo test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nalaro-seller-center-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
