name: nalaro_seller_center
description: Nalaro Seller Center — Aplikasi operasional toko multi-tenant untuk seller Nalaro Store (Android-first, iOS-ready).
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  go_router: ^14.2.7
  http: ^1.2.2
  intl: any
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  image: ^4.12.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
  assets:
    - assets/icons/
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/nalarostore-mark.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/brand/nalarostore-mark.png
